name = "absurd-os-boris"
main = "index.js"
compatibility_date = "2025-04-01"
workers_dev = true

# Safe default: adding a secret alone does NOT enable paid requests.
[vars]
AI_ENABLED = "false"
ALLOWED_ORIGIN = "https://zhorik333.github.io"
AI_BASE_URL = "https://api.openai.com/v1"
AI_MODEL = "gpt-4o-mini"
PER_IP_PER_MINUTE = "6"
DAILY_REQUEST_LIMIT = "200"

[[durable_objects.bindings]]
name = "BORIS_LIMITER"
class_name = "BorisLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BorisLimiter"]

[observability]
enabled = false
